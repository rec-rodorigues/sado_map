<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- サークル内で使うサイトなので、検索エンジンの検索結果に載せない -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>佐渡島マップ</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">

    <style>
        /* =========================================
           和モダンの配色（和紙・墨・朱）
           ========================================= */
        :root {
            --washi: #F5F0E6;
            --card: #FFFCF6;
            --line: #DED3BF;
            --line-strong: #C9BBA2;
            --sumi: #2B2622;
            --sub: #6F665B;
            --shu: #B33A2B;
            --shu-dark: #8E2E20;
            --shu-soft: #F3E3DC;
            --kin: #A5822F;
            --kin-soft: #F2EAD3;
            --koke: #5B7C4F;
            --koke-soft: #E5ECDD;
            --ai: #3E5C76;
            --radius: 4px;
            --serif: "Noto Serif JP", "Yu Mincho", serif;
            --sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--washi);
            color: var(--sumi);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.6;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px 24px;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }

        .ti {
            font-size: 1.1em;
            vertical-align: -0.12em;
        }

        /* =========================================
           ヘッダー
           ========================================= */
        .site-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 0 16px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--line);
        }

        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            background: var(--sumi);
            color: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .site-title {
            margin: 0;
            font-family: var(--serif);
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 0.08em;
            line-height: 1.2;
        }

        .site-subtitle {
            margin: 2px 0 0;
            font-size: 12px;
            color: var(--sub);
            letter-spacing: 0.1em;
        }

        /* =========================================
           共通パーツ：カード・ボタン・入力欄
           ========================================= */
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin: 14px 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--card);
            color: var(--sumi);
            cursor: pointer;
            line-height: 1.4;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s, transform 0.05s;
        }

        .btn:hover {
            background: var(--washi);
            border-color: var(--sumi);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--sumi);
            border-color: var(--sumi);
            color: var(--card);
        }

        .btn-primary:hover {
            background: #45403B;
            border-color: #45403B;
        }

        .btn-accent {
            background: var(--shu);
            border-color: var(--shu);
            color: var(--card);
        }

        .btn-accent:hover {
            background: var(--shu-dark);
            border-color: var(--shu-dark);
        }

        .btn-danger {
            color: var(--shu);
            border-color: #E3B8AF;
        }

        .btn-danger:hover {
            background: var(--shu-soft);
            border-color: var(--shu);
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 13px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            padding: 8px 10px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: #FFFFFF;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--sumi);
            box-shadow: 0 0 0 3px rgba(43, 38, 34, 0.12);
        }

        input[type="checkbox"] {
            accent-color: var(--shu);
        }

        .field-label {
            font-size: 12px;
            color: var(--sub);
            letter-spacing: 0.05em;
        }

        .small-note {
            font-size: 12px;
            color: var(--sub);
        }

        /* =========================================
           マップ切り替え・編集モード
           ========================================= */
        .map-bar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        #mapSelect {
            min-width: 220px;
            max-width: 100%;
            font-size: 15px;
        }

        #mapDescription {
            margin-top: 8px;
            font-size: 13px;
            color: var(--sub);
            white-space: pre-wrap;
        }

        #mapDescription:empty {
            display: none;
        }

        .lock-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            white-space: nowrap;
        }

        .lock-badge.unlocked {
            background: var(--koke-soft);
            color: #3B5432;
        }

        .lock-badge.locked {
            background: #ECE6DA;
            color: var(--sub);
        }

        .map-bar-spacer {
            flex: 1;
        }

        #controls {
            display: none;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        #modeText {
            font-size: 13px;
            color: var(--sub);
        }

        #editHint {
            display: none;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: var(--radius);
            background: var(--shu-soft);
            color: var(--shu-dark);
        }

        /* =========================================
           管理者メニュー
           ========================================= */
        #adminPanel {
            display: none;
            border-left: 3px solid var(--shu);
            border-radius: 0;
        }

        .admin-title {
            margin: 0 0 4px;
            font-family: var(--serif);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-section {
            padding: 12px 0 4px;
            border-top: 1px dashed var(--line);
            margin-top: 10px;
        }

        .admin-section h4 {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--sub);
        }

        .admin-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .admin-form input[type="text"] {
            width: 240px;
            max-width: 100%;
        }

        .admin-form label {
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* =========================================
           カテゴリーのチップ
           ========================================= */
        #categoryFilters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 14px 0;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--card);
            color: var(--sumi);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .chip .ti {
            color: var(--chip-color, var(--sub));
        }

        .chip:hover {
            border-color: var(--sumi);
        }

        .chip.active {
            background: var(--sumi);
            border-color: var(--sumi);
            color: var(--card);
        }

        .chip.active .ti {
            color: var(--card);
        }

        /* =========================================
           地図
           ========================================= */
        #map {
            height: 600px;
            width: 100%;
            position: relative;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #E9E4D8;
        }

        /* 地図の色を少し落ち着かせて、和紙の背景になじませる */
        #map .leaflet-tile-pane {
            filter: sepia(0.3) saturate(0.7) brightness(1.02);
        }

        #map:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        #map:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .leaflet-bar,
        .fullscreen-control {
            border: 1px solid var(--line-strong) !important;
            border-radius: var(--radius) !important;
            box-shadow: none !important;
            overflow: hidden;
        }

        .leaflet-bar a,
        .fullscreen-control button {
            background: var(--card) !important;
            color: var(--sumi) !important;
        }

        .leaflet-bar a:hover,
        .fullscreen-control button:hover {
            background: var(--washi) !important;
        }

        .fullscreen-control button {
            display: block;
            width: 34px;
            height: 34px;
            border: 0;
            cursor: pointer;
            font-size: 18px;
            line-height: 34px;
            padding: 0;
        }

        /* マーカー（しずく型のピン） */
        .pin-marker {
            background: none;
            border: none;
        }

        .pin {
            position: relative;
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            background: var(--pin-color, var(--sumi));
            transform: rotate(-45deg);
            border: 2px solid var(--card);
            box-shadow: 0 2px 4px rgba(43, 38, 34, 0.35);
        }

        .pin .ti {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(45deg);
            color: var(--card);
            font-size: 16px;
            vertical-align: 0;
        }

        .pin.pin-temp {
            background: var(--card);
            border-color: var(--shu);
        }

        .pin.pin-temp .ti {
            color: var(--shu);
        }

        /* スポットのポップアップ */
        .leaflet-popup-content-wrapper {
            background: var(--card);
            color: var(--sumi);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 6px 20px rgba(43, 38, 34, 0.18);
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
        }

        .leaflet-popup-tip {
            background: var(--card);
        }

        /* 写真の上でも見えるように、白い丸の上に「×」を置く */
        .leaflet-container a.leaflet-popup-close-button {
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 252, 246, 0.92);
            color: var(--sumi);
            font: 18px/26px var(--sans);
            text-align: center;
            z-index: 2;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            background: var(--card);
            color: var(--shu);
        }

        .spot-popup {
            width: 280px;
            max-width: 72vw;
        }

        .spot-popup-body {
            padding: 12px 14px 14px;
        }

        .spot-popup-title {
            margin: 0 0 6px;
            font-family: var(--serif);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding-right: 16px;
        }

        .spot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .spot-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--radius);
            background: var(--tag-bg, #ECE6DA);
            color: var(--tag-color, var(--sub));
        }

        .spot-info {
            display: grid;
            grid-template-columns: 18px minmax(0, 1fr);
            gap: 2px 6px;
            margin: 8px 0 0;
            padding-top: 8px;
            border-top: 1px dashed var(--line);
        }

        .spot-info .ti {
            color: var(--sub);
            margin-top: 3px;
        }

        .spot-info-label {
            font-size: 11px;
            color: var(--sub);
        }

        .spot-info-value {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .spot-popup-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
        }

        .spot-gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
        }

        .spot-gallery.single {
            grid-template-columns: minmax(0, 1fr);
        }

        .spot-gallery-item {
            min-width: 0;
        }

        .spot-gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            cursor: zoom-in;
            display: block;
            background: #ECE6DA;
        }

        .spot-gallery.single img {
            height: 150px;
        }

        .spot-no-photo {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #EFE9DD;
            color: var(--sub);
            font-size: 12px;
        }

        /* =========================================
           追加・編集フォーム（後ろを暗くして中央に表示）
           ========================================= */
        #spotForm,
        #editSpotForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            max-width: 92vw;
            max-height: 88vh;
            overflow-y: auto;
            background: var(--card);
            padding: 22px 22px 18px;
            border: 1px solid var(--line);
            border-top: 4px solid var(--shu);
            border-radius: var(--radius);
            box-shadow: 0 0 0 100vmax rgba(43, 38, 34, 0.45), 0 10px 30px rgba(0, 0, 0, 0.25);
            z-index: 1000;
        }

        #spotForm h2,
        #editSpotForm h2 {
            margin: 0 0 6px;
            font-family: var(--serif);
            font-size: 19px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #spotForm label,
        #editSpotForm label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--sub);
            letter-spacing: 0.05em;
        }

        #spotForm input[type="text"],
        #spotForm select,
        #spotForm textarea,
        #editSpotForm input[type="text"],
        #editSpotForm select,
        #editSpotForm textarea {
            width: 100%;
        }

        #spotForm textarea,
        #editSpotForm textarea {
            min-height: 76px;
            resize: vertical;
        }

        input[type="file"] {
            width: 100%;
            font-size: 13px;
        }

        input[type="file"]::file-selector-button {
            margin-right: 10px;
            padding: 6px 12px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--card);
            color: var(--sumi);
            cursor: pointer;
        }

        .photo-help {
            font-size: 12px;
            color: var(--sub);
            margin-top: 4px;
        }

        #formButtons,
        #editFormButtons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .photo-preview {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-top: 8px;
        }

        .photo-preview:empty {
            display: none;
        }

        .photo-preview-item,
        .existing-photo-item {
            position: relative;
        }

        .photo-preview-item img,
        .existing-photo-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: var(--radius);
            display: block;
        }

        .photo-preview-item button {
            position: absolute;
            top: 4px;
            right: 4px;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            background: rgba(43, 38, 34, 0.75);
            color: white;
            line-height: 20px;
            padding: 0;
        }

        .existing-photo-item button {
            position: absolute;
            top: 4px;
            right: 4px;
            padding: 2px 8px;
            font-size: 11px;
            border: none;
            border-radius: var(--radius);
            background: rgba(43, 38, 34, 0.75);
            color: white;
            cursor: pointer;
        }

        .existing-photo-item button:disabled {
            background: var(--shu);
        }

        /* =========================================
           フッター（管理者ログイン）
           ========================================= */
        #authArea {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--sub);
        }

        #userInfo,
        #roleInfo {
            font-size: 13px;
        }

        #roleInfo {
            color: var(--shu);
        }

        /* =========================================
           お知らせ（画面下に数秒だけ表示）
           ========================================= */
        #toastArea {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: max-content;
            max-width: 92vw;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 16px;
            border-radius: var(--radius);
            background: var(--sumi);
            color: var(--card);
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            white-space: pre-line;
            pointer-events: auto;
            animation: toast-in 0.2s ease-out;
        }

        .toast.error {
            background: var(--shu);
        }

        .toast .ti {
            margin-top: 2px;
        }

        .toast.hide {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s, transform 0.25s;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        /* =========================================
           写真ライトボックス
           ========================================= */
        #photoLightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(24, 21, 19, 0.92);
            align-items: center;
            justify-content: center;
            padding: 60px 20px 40px;
        }

        #photoLightbox.open {
            display: flex;
        }

        #photoLightboxImage {
            display: block;
            max-width: 92vw;
            max-height: 82vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: var(--radius);
            box-shadow: 0 8px 35px rgba(0,0,0,0.5);
        }

        #photoLightboxClose {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: var(--card);
            color: var(--sumi);
            font-size: 28px;
            line-height: 44px;
            padding: 0;
            cursor: pointer;
            z-index: 2;
        }

        #photoLightboxCaption {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 12px;
            text-align: center;
            color: white;
            font-family: var(--serif);
            font-size: 15px;
            letter-spacing: 0.05em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* =========================================
           スマホ
           ========================================= */
        @media (max-width: 600px) {
            .page {
                padding: 0 12px 20px;
            }

            .site-header {
                padding: 14px 0 12px;
            }

            .site-title {
                font-size: 21px;
            }

            .site-logo {
                width: 34px;
                height: 34px;
                font-size: 19px;
            }

            #map {
                height: 70vh;
            }

            /* マップ名が切れないよう、選択欄を横幅いっぱいにする */
            #mapSelect {
                min-width: 0;
                flex: 1 1 calc(100% - 60px);
            }

            .map-bar-spacer {
                display: none;
            }

            #photoLightbox {
                padding: 55px 10px 35px;
            }

            #photoLightboxImage {
                max-width: 96vw;
                max-height: 84vh;
            }

            #photoLightboxClose {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <header class="site-header">
        <div class="site-logo" aria-hidden="true"><i class="ti ti-map-2"></i></div>
        <div>
            <h1 class="site-title">佐渡島マップ</h1>
            <p class="site-subtitle">佐渡での活動・宿泊・観光の記録</p>
        </div>
    </header>

    <!-- マップ切り替え（全員に表示） -->
    <div id="mapBar" class="card">
        <div class="map-bar-row">
            <label for="mapSelect" class="field-label">マップ</label>

    <script>
        // =========================================
        // Supabase
        // =========================================
        const SUPABASE_URL =
            "https://duckvgbpidcducxjiweh.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_p7houiZXM67fgzBY0qnJmQ_B6xxI7e9";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        // =========================================
        // Leaflet地図
        // =========================================
        const map = L.map("map").setView([38.0, 138.4], 10);

        // 地図の色味は CSS（.leaflet-tile-pane の filter）で和紙になじませている
        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors",
                maxZoom: 19
            }
        ).addTo(map);

        // =========================================
        // 地図の全画面表示
        // =========================================
        const FullscreenControl = L.Control.extend({
            options: {
                position: "topright"
            },

            onAdd: function() {
                const container = L.DomUtil.create(
                    "div",
                    "fullscreen-control leaflet-bar"
                );

                const button = L.DomUtil.create(
                    "button",
                    "fullscreen-button",
                    container
                );

                button.type = "button";
                button.innerHTML = "<i class=\"ti ti-maximize\"></i>";
                button.title = "地図を全画面表示";
                button.setAttribute(
                    "aria-label",
                    "地図を全画面表示"
                );

                // ボタン操作が地図のクリックやドラッグとして
                // 誤認識されないようにする
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                async function toggleFullscreen() {
                    const mapContainer = map.getContainer();

                    try {
                        const isFullscreen =
                            document.fullscreenElement === mapContainer ||
                            document.webkitFullscreenElement === mapContainer;

                        if (!isFullscreen) {
                            if (mapContainer.requestFullscreen) {
                                await mapContainer.requestFullscreen();
                            } else if (mapContainer.webkitRequestFullscreen) {
                                mapContainer.webkitRequestFullscreen();
                            } else {
                                notify("このブラウザでは全画面表示に対応していません。");
                                return;
                            }
                        } else {
                            if (document.exitFullscreen) {
                                await document.exitFullscreen();
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            }
                        }
                    } catch (error) {
                        console.error("全画面表示エラー:", error);
                        notify("全画面表示を開始できませんでした。");
                    }
                }

                button.addEventListener("click", toggleFullscreen);

                function updateFullscreenButton() {
                    const mapContainer = map.getContainer();
                    const isFullscreen =
                        document.fullscreenElement === mapContainer ||
                        document.webkitFullscreenElement === mapContainer;

                    button.innerHTML = isFullscreen
                        ? "<i class=\"ti ti-minimize\"></i>"
                        : "<i class=\"ti ti-maximize\"></i>";

                    button.title = isFullscreen
                        ? "全画面表示を終了"
                        : "地図を全画面表示";

                    button.setAttribute(
                        "aria-label",
                        isFullscreen
                            ? "全画面表示を終了"
                            : "地図を全画面表示"
                    );

                    // 全画面切り替え後にLeafletの表示サイズを再計算
                    setTimeout(function() {
                        map.invalidateSize();
                    }, 100);
                }

                document.addEventListener(
                    "fullscreenchange",
                    updateFullscreenButton
                );

                document.addEventListener(
                    "webkitfullscreenchange",
                    updateFullscreenButton
                );

                return container;
            }
        });

        map.addControl(new FullscreenControl());

        // =========================================
        // カテゴリー

        const layers = {
            "活動場所": L.layerGroup().addTo(map),

            "生活用品店": L.layerGroup().addTo(map)
        };

        // カテゴリーごとの色とアイコン（朱・墨・金・苔・藍）
        const categoryStyles = {
            "活動場所": { color: "#B33A2B", soft: "#F3E3DC", text: "#8E2E20", icon: "ti-plant-2" },
            "宿泊地": { color: "#2B2622", soft: "#E8E2D7", text: "#2B2622", icon: "ti-home" },
            "観光地": { color: "#A5822F", soft: "#F2EAD3", text: "#6E5517", icon: "ti-building-castle" },
            "飲食店": { color: "#5B7C4F", soft: "#E5ECDD", text: "#3B5432", icon: "ti-tools-kitchen-2" },
            "生活用品店": { color: "#3E5C76", soft: "#E1E8EE", text: "#2C4256", icon: "ti-shopping-bag" }
        };

        const defaultCategoryStyle = { color: "#6F665B", soft: "#ECE6DA", text: "#6F665B", icon: "ti-map-pin" };

        function getCategoryStyle(category) {
            return categoryStyles[category] || defaultCategoryStyle;
        }

        // しずく型のピン（先端が地点を指すように、下中央を基準にする）
        function makePinIcon(style, extraClass) {
            return L.divIcon({
                html:
                    "<div class=\"pin " + (extraClass || "") + "\" style=\"--pin-color:" + style.color + "\">" +
                    "<i class=\"ti " + style.icon + "\"></i></div>",
                className: "pin-marker",
                // 32px の正方形を45度回しているので、先端は中心から約23px下
                iconSize: [32, 32],
                iconAnchor: [16, 39],
                popupAnchor: [0, -36]
            });
        }

        const icons = {};

        Object.keys(categoryStyles).forEach(function(category) {
            icons[category] = makePinIcon(categoryStyles[category]);
        });

        const defaultIcon = makePinIcon(defaultCategoryStyle);

        const temporaryIcon = makePinIcon(
            { color: "#FFFCF6", icon: "ti-plus" },
            "pin-temp"
        );

        // =========================================
        // 状態
        // =========================================
        let editMode = false;
        let editingSpotId = null;
        let currentUserIsAdmin = false;
        let maps = [];
        let currentMapId = null;
        let newSpotLat = null;
        let newSpotLng = null;
        let temporaryMarker = null;

        let selectedSpotImages = [];
        let selectedEditImages = [];
        let existingEditImages = [];
        let imagesToDelete = [];

        // =========================================
        // HTML要素
        // =========================================
        const loginButton = document.getElementById("loginButton");
        const logoutButton = document.getElementById("logoutButton");
        const userInfo = document.getElementById("userInfo");
        const roleInfo = document.getElementById("roleInfo");
        const controls = document.getElementById("controls");
        const editModeButton = document.getElementById("editModeButton");
        const modeText = document.getElementById("modeText");
        const editHint = document.getElementById("editHint");
        const adminPanel = document.getElementById("adminPanel");
        const mapSelect = document.getElementById("mapSelect");
        const lockBadge = document.getElementById("lockBadge");
        const mapDescription = document.getElementById("mapDescription");
        const toggleLockButton = document.getElementById("toggleLockButton");
        const lockStatusText = document.getElementById("lockStatusText");
        const editMapName = document.getElementById("editMapName");
        const editMapDescription = document.getElementById("editMapDescription");
        const newMapName = document.getElementById("newMapName");
        const newMapDescription = document.getElementById("newMapDescription");
        const newMapUnlocked = document.getElementById("newMapUnlocked");
        const toastArea = document.getElementById("toastArea");

        // =========================================
        // お知らせ（alert の代わりに画面下へ数秒だけ表示）
        // =========================================
        const ERROR_WORDS = /失敗|できません|できませんでした|ください|対応していません|超えて|ではありません|されていません|だけです/;

        function notify(message) {
            const text = String(message ?? "");
            const isError = ERROR_WORDS.test(text);

            const toast = document.createElement("div");
            toast.className = "toast" + (isError ? " error" : "");

            const icon = document.createElement("i");
            icon.className = "ti " + (isError ? "ti-alert-circle" : "ti-check");

            const body = document.createElement("span");
            body.textContent = text;

            toast.appendChild(icon);
            toast.appendChild(body);
            toastArea.appendChild(toast);

            // エラーは読めるように長めに表示する
            const duration = isError ? 6000 : 3000;

            setTimeout(function() {
                toast.classList.add("hide");
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }, duration);
        }

        // =========================================
        // 今のマップと編集できるかどうか
        // =========================================
        function getCurrentMap() {
            return maps.find(function(m) {
                return m.id === currentMapId;
            }) || null;
        }

        // ロック解除中のマップなら誰でも、ロック中でも管理者は編集できる
        function canEdit() {
            const currentMap = getCurrentMap();

            if (!currentMap) {
                return false;
            }

            return !currentMap.is_locked || currentUserIsAdmin;
        }

        // 保存エラーがロックによるものかを判定して、分かりやすく伝える
        async function explainSaveError(prefix, error) {
            console.error(prefix, error);

            const isPermissionError =
                error && (
                    error.code === "42501" ||
                    /row-level security|permission|policy/i.test(error.message || "")
                );

            if (isPermissionError) {
                notify(
                    prefix + "\n\n" +
                    "このマップは管理者によってロックされたため、編集できません。"
                );
                await loadMaps();
                await loadPlaces();
                return;
            }

            notify(prefix + "\n" + (error && error.message ? error.message : ""));
        }

        // =========================================
        // 画面上のHTMLに安全に文字を入れるための関数
        // =========================================
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/`/g, "&#096;");
        }

        // =========================================
        // 写真プレビュー
        // =========================================
        function renderPhotoPreview(files, previewId, selectedArray) {
            const preview = document.getElementById(previewId);

            if (!preview) {
                console.error("写真プレビュー欄が見つかりません:", previewId);
                return;
            }

            preview.innerHTML = "";

            files.forEach(function(file, index) {
                const reader = new FileReader();

                reader.onload = function(event) {
                    const item = document.createElement("div");
                    item.className = "photo-preview-item";

                    const image = document.createElement("img");
                    image.src = event.target.result;
                    image.alt = "選択した写真";

                    const removeButton = document.createElement("button");
                    removeButton.type = "button";
                    removeButton.textContent = "×";
                    removeButton.title = "この写真を外す";

                    removeButton.addEventListener("click", function() {
                        selectedArray.splice(index, 1);
                        renderPhotoPreview(
                            selectedArray,
                            previewId,
                            selectedArray
                        );
                    });

                    item.appendChild(image);
                    item.appendChild(removeButton);
                    preview.appendChild(item);
                };

                reader.readAsDataURL(file);
            });
        }

        function handlePhotoSelection(inputId, previewId, selectedArray) {
            const input = document.getElementById(inputId);

            // 今回のエラー対策：HTML要素がない場合は処理を止める
            if (!input) {
                console.error("写真入力欄が見つかりません:", inputId);
                return;
            }

            input.addEventListener("change", function() {
                Array.from(input.files || []).forEach(function(file) {
                    if (!file.type.startsWith("image/")) {
                        notify(file.name + " は画像ファイルではありません。");
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        notify(file.name + " は5MBを超えています。");
                        return;
                    }

                    selectedArray.push(file);
                });

                input.value = "";

                renderPhotoPreview(
                    selectedArray,
                    previewId,
                    selectedArray
                );
            });
        }

        // 必ずHTML側に存在するIDを使用
        handlePhotoSelection(
            "spotImages",
            "spotPhotoPreview",
            selectedSpotImages
        );

        handlePhotoSelection(
            "editSpotImages",
            "editPhotoPreview",
            selectedEditImages
        );

        // =========================================
        // Storageへ複数写真をアップロード
        // =========================================
        async function uploadSpotImages(spotId, files) {
            const uploadedImages = [];

            for (const file of files) {
                const extension =
                    file.name.includes(".")
                        ? file.name.split(".").pop().toLowerCase()
                        : "jpg";

                const filePath =
                    spotId + "/" + crypto.randomUUID() + "." + extension;

                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("spot-images")
                        .upload(filePath, file, {
                            cacheControl: "3600",
                            upsert: false
                        });

                if (uploadError) {
                    throw uploadError;
                }

                const { data: publicUrlData } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(filePath);

                const imageUrl = publicUrlData.publicUrl;

                const { data: imageRow, error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .insert({
                            spot_id: spotId,
                            image_url: imageUrl,
                            file_path: filePath
                        })
                        .select()
                        .single();

                if (dbError) {
                    // DB登録に失敗した場合は、今アップロードしたファイルを削除する
                    await supabaseClient.storage
                        .from("spot-images")
                        .remove([filePath]);

                    throw dbError;
                }

                uploadedImages.push(imageRow);
            }

            return uploadedImages;
        }

        // =========================================
        // 写真URLを確実に作る
        // =========================================
        function getPhotoUrl(image) {
            // file_pathがある場合はStorageからURLを作り直す
            // image_urlが古い・誤っている場合でも表示できるようにする
            if (image && image.file_path) {
                const { data } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(image.file_path);

                if (data && data.publicUrl) {
                    return data.publicUrl;
                }
            }

            return image && image.image_url
                ? image.image_url
                : "";
        }

        // =========================================
        // 写真一覧を取得
        // =========================================
        async function getSpotImages(spotId) {
            const { data, error } =
                await supabaseClient
                    .from("spot_images")
                    .select("id, spot_id, image_url, file_path, created_at")
                    .eq("spot_id", spotId)
                    .order("created_at", { ascending: true });

            if (error) {
                console.error("写真取得エラー:", error);
                return [];
            }

            return (data || []).filter(function(image) {
                return !!getPhotoUrl(image);
            });
        }

        // =========================================
        // ポップアップ写真を作る
        // =========================================
        function buildGalleryHtml(images, spotName) {
            if (!images || images.length === 0) {
                return `
                    <div class="spot-no-photo">
                        <i class="ti ti-photo-off"></i>写真は登録されていません
                    </div>
                `;
            }

            // ポップアップが縦に長くなりすぎないよう、最大4枚まで並べる
            const shownImages = images.slice(0, 4);

            const galleryItems = shownImages.map(function(image) {
                const photoUrl = getPhotoUrl(image);
                const safeUrl = escapeAttribute(photoUrl);
                const safeName = escapeAttribute(spotName || "スポット写真");

                return `
                    <div class="spot-gallery-item">
                        <img
                            src="${safeUrl}"
                            alt="${safeName}"
                            loading="lazy"
                            data-photo-url="${safeUrl}"
                            data-photo-caption="${safeName}"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                            title="クリックで写真を拡大"
                        >
                        <div class="spot-no-photo" style="display:none;">
                            写真を読み込めませんでした
                        </div>
                    </div>
                `;
            }).join("");

            const moreNote =
                images.length > shownImages.length
                    ? `<div class="small-note" style="padding:4px 14px 0;">ほか${images.length - shownImages.length}枚（編集画面で確認できます）</div>`
                    : "";

            return `
                <div class="spot-gallery${shownImages.length === 1 ? " single" : ""}">${galleryItems}</div>
                ${moreNote}
            `;
        }

        // =========================================
        // 写真ライトボックス
        // =========================================
        const photoLightbox = document.getElementById("photoLightbox");
        const photoLightboxImage = document.getElementById("photoLightboxImage");
        const photoLightboxClose = document.getElementById("photoLightboxClose");
        const photoLightboxCaption = document.getElementById("photoLightboxCaption");

        function openPhotoViewer(url, caption) {
            if (!url) {
                return;
            }

            photoLightboxImage.src = url;
            photoLightboxImage.alt = caption || "スポット写真";
            photoLightboxCaption.textContent = caption || "";
            photoLightbox.classList.add("open");
            photoLightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closePhotoViewer() {
            photoLightbox.classList.remove("open");
            photoLightbox.setAttribute("aria-hidden", "true");
            photoLightboxImage.src = "";
            photoLightboxImage.alt = "拡大写真";
            photoLightboxCaption.textContent = "";
            document.body.style.overflow = "";
        }

        photoLightboxClose.addEventListener("click", closePhotoViewer);

        // 黒い背景部分をクリックして閉じる
        photoLightbox.addEventListener("click", function(event) {
            if (event.target === photoLightbox) {
                closePhotoViewer();
            }
        });

        // Escキーで閉じる
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape" && photoLightbox.classList.contains("open")) {
                closePhotoViewer();
            }
        });

        // Leafletのポップアップは動的に生成されるため、
        // document側で写真クリックを受け取る
        document.addEventListener("click", function(event) {
            const image = event.target.closest(".spot-gallery img");

            if (!image) {
                return;
            }

            const url = image.getAttribute("data-photo-url");
            const caption = image.getAttribute("data-photo-caption");

            openPhotoViewer(url, caption);
        });

        window.openPhotoViewer = openPhotoViewer;

        // =========================================
        // スポット読み込み
        // =========================================
        // 読み込みが同時に走ったとき、最後に始めたものだけを地図に反映する
        // （古い読み込みの結果でマーカーが二重に置かれるのを防ぐ）
        let loadPlacesSequence = 0;

        async function loadPlaces() {
            const sequence = ++loadPlacesSequence;

            Object.values(layers).forEach(function(layer) {
                layer.clearLayers();
            });

            if (currentMapId === null) {
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("spots")
                    .select("*")
                    .eq("map_id", currentMapId)
                    .order("id", { ascending: true });

            if (error) {
                console.error("Supabaseエラー:", error);
                notify(
                    "スポット情報を取得できませんでした。\n" +
                    error.message
                );
                return;
            }

            // このマップのスポットの写真だけをまとめて取得
            let allImages = [];
            const spotIds = (data || []).map(function(place) {
                return place.id;
            });

            if (spotIds.length > 0) {
                const { data: imageData, error: imageError } =
                    await supabaseClient
                        .from("spot_images")
                        .select("id, spot_id, image_url, file_path, created_at")
                        .in("spot_id", spotIds)
                        .order("created_at", { ascending: true });

                if (imageError) {
                    console.error("写真一覧取得エラー:", imageError);
                    console.error("Supabaseのspot_images SELECTポリシーを確認してください。");
                } else {
                    allImages = imageData || [];
                }
            }

            if (sequence !== loadPlacesSequence) {
                return;
            }

            Object.values(layers).forEach(function(layer) {
                layer.clearLayers();
            });

            const imagesBySpot = {};

            allImages.forEach(function(image) {
                if (!imagesBySpot[image.spot_id]) {
                    imagesBySpot[image.spot_id] = [];
                }
                if (getPhotoUrl(image)) {
                    imagesBySpot[image.spot_id].push(image);
                }
            });

            for (const place of data || []) {
                const marker = L.marker(
                    [place.lat, place.lng],
                    {
                        icon: icons[place.category] || defaultIcon
                    }
                );

                // このスポットに登録されている写真
                const images = imagesBySpot[place.id] || [];

                // 以前の形式で保存された写真も表示
                if (place.image_url && images.length === 0) {
                    images.push({
                        image_url: place.image_url,
                        file_path: null
                    });
                }

                const style = getCategoryStyle(place.category);

                // 空欄の項目は表示しない
                const infoRows = [
                    ["ti-map-pin", "所在地", place.address],
                    ["ti-clipboard-text", "活動内容・利用内容", place.activity_history],
                    ["ti-notes", "メモ", place.note],
                    ["ti-info-circle", "説明", place.description]
                ].filter(function(row) {
                    return row[2] && String(row[2]).trim() !== "";
                }).map(function(row) {
                    return `
                        <i class="ti ${row[0]}"></i>
                        <div>
                            <div class="spot-info-label">${row[1]}</div>
                            <div class="spot-info-value">${escapeHtml(row[2])}</div>
                        </div>
                    `;
                }).join("");

                let popupHtml = `
                    <div class="spot-popup">
                        ${buildGalleryHtml(images, place.name)}

                        <div class="spot-popup-body">
                            <h2 class="spot-popup-title">${escapeHtml(place.name || "")}</h2>

                            <div class="spot-tags">
                                <span class="spot-tag" style="--tag-bg:${style.soft};--tag-color:${style.text};">
                                    <i class="ti ${style.icon}"></i> ${escapeHtml(place.category || "未分類")}
                                </span>
                                ${
                                    place.subcategory
                                        ? `<span class="spot-tag">${escapeHtml(place.subcategory)}</span>`
                                        : ""
                                }
                            </div>

                            ${infoRows ? `<div class="spot-info">${infoRows}</div>` : ""}
                `;

                if (canEdit() && editMode) {
                    popupHtml += `
                        <div class="spot-popup-actions">
                            <button
                                type="button"
                                class="btn btn-small btn-primary"
                                onclick="openEditForm(${Number(place.id)})"
                            >
                                <i class="ti ti-pencil"></i>編集
                            </button>
                    `;

                    if (currentUserIsAdmin) {
                        popupHtml += `
                            <button
                                type="button"
                                class="btn btn-small btn-danger"
                                onclick="deleteSpot(${Number(place.id)})"
                            >
                                <i class="ti ti-trash"></i>削除
                            </button>
                        `;
                    }

                    popupHtml += "</div>";
                }

                popupHtml += "</div></div>";

                marker.bindPopup(popupHtml);

                if (layers[place.category]) {
                    marker.addTo(layers[place.category]);
                } else {
                    marker.addTo(map);
                }
            }
        }

        // =========================================
        // カテゴリー表示
        // =========================================
        // 選んでいるカテゴリーのチップに色を付ける（"" は「すべて」）
        function setActiveChip(category) {
            document.querySelectorAll("#categoryFilters .chip").forEach(function(chip) {
                const isActive = chip.dataset.category === category;
                chip.classList.toggle("active", isActive);
                chip.setAttribute("aria-pressed", isActive ? "true" : "false");
            });
        }

        function showAllLayers() {
            setActiveChip("");

            Object.values(layers).forEach(function(layer) {
                if (!map.hasLayer(layer)) {
                    layer.addTo(map);
                }
            });
        }

        function showCategory(category) {
            setActiveChip(category);

            Object.values(layers).forEach(function(layer) {
                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            });

            if (layers[category]) {
                layers[category].addTo(map);
            }
        }

        window.showAllLayers = showAllLayers;
        window.showCategory = showCategory;

        // =========================================
        // 編集モード
        // =========================================
        function setEditMode(value) {

            if (editMode) {
                editModeButton.innerHTML = "<i class=\"ti ti-eye\"></i>閲覧モードに戻す";

        editModeButton.addEventListener("click", async function() {

        // =========================================
        // 地図をクリックして新規スポット
        // =========================================
        map.on("click", function(e) {
            if (!canEdit() || !editMode) {
                return;
            }

            newSpotLat = e.latlng.lat;
            newSpotLng = e.latlng.lng;

            if (temporaryMarker) {
                map.removeLayer(temporaryMarker);
            }

                [newSpotLat, newSpotLng],
                { icon: temporaryIcon }
            ).addTo(map);

            temporaryMarker
                .bindPopup("ここにスポットを追加します")
                .openPopup();

            selectedSpotImages.length = 0;
            document.getElementById("spotPhotoPreview").innerHTML = "";

            document.getElementById("spotForm").style.display = "block";
        });

        // =========================================
        // 新規追加キャンセル
        // =========================================
        document.getElementById("cancelButton").addEventListener("click", function() {
            closeSpotForm();
        });

        function closeSpotForm() {
            document.getElementById("spotForm").style.display = "none";

            if (temporaryMarker) {
                map.removeLayer(temporaryMarker);
                temporaryMarker = null;
            }

            newSpotLat = null;
            newSpotLng = null;
            selectedSpotImages.length = 0;
            document.getElementById("spotPhotoPreview").innerHTML = "";
            document.getElementById("spotImages").value = "";
            document.getElementById("spotName").value = "";
            document.getElementById("spotSubcategory").value = "";
            document.getElementById("spotAddress").value = "";
            document.getElementById("spotActivity").value = "";
            document.getElementById("spotNote").value = "";
        }

        // =========================================
        // 新規スポット保存
        // =========================================
        document.getElementById("saveButton").addEventListener("click", async function() {
            if (!canEdit()) {
                notify("このマップはロックされているため、スポットを追加できません。");
                return;
            }

            if (newSpotLat === null || newSpotLng === null) {
                notify("地図上の場所を選択してください。");
                return;
            }

            const name = document.getElementById("spotName").value.trim();
            const category = document.getElementById("spotCategory").value;
            const subcategory = document.getElementById("spotSubcategory").value.trim();
            const address = document.getElementById("spotAddress").value.trim();
            const activity = document.getElementById("spotActivity").value.trim();
            const note = document.getElementById("spotNote").value.trim();

            if (!name) {
                notify("スポット名を入力してください。");
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("spots")
                    .insert({
                        map_id: currentMapId,
                        name: name,
                        lat: newSpotLat,
                        lng: newSpotLng,
                        category: category,
                        subcategory: subcategory,
                        address: address,
                        activity_history: activity,
                        note: note
                    })
                    .select()
                    .single();

            if (error) {
                await explainSaveError("スポットの保存に失敗しました。", error);
                return;
            }

            try {
                if (selectedSpotImages.length > 0) {
                    await uploadSpotImages(data.id, selectedSpotImages);
                }
            } catch (imageError) {
                console.error("写真保存エラー:", imageError);
                notify(
                    "スポット本体は保存されましたが、写真の保存に失敗しました。\n" +
                    imageError.message
                );
            }

            notify("スポットを保存しました！");
            closeSpotForm();
            await loadPlaces();
        });

        // =========================================
        // 編集フォームを開く
        // =========================================
        async function openEditForm(id) {
            if (!canEdit()) {
                notify("このマップはロックされているため、編集できません。");
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("spots")
                    .select("*")
                    .eq("id", id)
                    .single();

            if (error) {
                console.error("スポット取得エラー:", error);
                notify("スポット情報を取得できませんでした。\n" + error.message);
                return;
            }

            editingSpotId = id;
            selectedEditImages.length = 0;
            imagesToDelete = [];

            document.getElementById("editSpotName").value = data.name || "";
            document.getElementById("editSpotCategory").value = data.category || "活動場所";
            document.getElementById("editSpotSubcategory").value = data.subcategory || "";
            document.getElementById("editSpotAddress").value = data.address || "";
            document.getElementById("editSpotActivity").value = data.activity_history || "";
            document.getElementById("editSpotNote").value = data.note || "";
            document.getElementById("editSpotImages").value = "";
            document.getElementById("editPhotoPreview").innerHTML = "";
            document.getElementById("legacyEditPhotoPreview").innerHTML = "";

            existingEditImages = await getSpotImages(id);
            renderExistingEditImages();

            // 旧image_urlが存在し、spot_imagesにない場合は「旧写真」として表示
            if (data.image_url && existingEditImages.length === 0) {
                const legacy = document.createElement("div");
                legacy.innerHTML =
                    "<div class='small-note'>以前の形式で保存された写真</div>" +
                    `<img src="${escapeAttribute(data.image_url)}" alt="現在のスポット写真" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:6px;">`;
                document.getElementById("legacyEditPhotoPreview").appendChild(legacy);
            }

            document.getElementById("editSpotForm").style.display = "block";
        }

        window.openEditForm = openEditForm;

        // =========================================
        // 既存写真の表示
        // =========================================
        function renderExistingEditImages() {
            const container = document.getElementById("existingEditPhotoPreview");
            container.innerHTML = "";

            existingEditImages.forEach(function(image) {
                const item = document.createElement("div");
                item.className = "existing-photo-item";

                const img = document.createElement("img");
                img.src = getPhotoUrl(image);
                img.alt = "登録済み写真";

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "削除";
                deleteButton.title = "保存時にこの写真を削除します";

                deleteButton.addEventListener("click", function() {
                    const alreadyMarked = imagesToDelete.some(function(item) {
                        return item.id === image.id;
                    });

                    if (alreadyMarked) {
                        return;
                    }

                    imagesToDelete.push(image);
                    item.style.opacity = "0.35";
                    deleteButton.textContent = "削除予定";
                    deleteButton.disabled = true;
                });

                item.appendChild(img);
                item.appendChild(deleteButton);
                container.appendChild(item);
            });
        }

        // =========================================
        // 編集キャンセル
        // =========================================
        document.getElementById("editCancelButton").addEventListener("click", function() {
            closeEditForm();
        });

        function closeEditForm() {
            document.getElementById("editSpotForm").style.display = "none";
            document.getElementById("editSpotImages").value = "";
            document.getElementById("editPhotoPreview").innerHTML = "";
            document.getElementById("existingEditPhotoPreview").innerHTML = "";
            document.getElementById("legacyEditPhotoPreview").innerHTML = "";

            selectedEditImages.length = 0;
            existingEditImages = [];
            imagesToDelete = [];
            editingSpotId = null;
        }

        // =========================================
        // 既存写真削除を実行
        // =========================================
        async function deleteMarkedImages() {
            for (const image of imagesToDelete) {
                const { error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .eq("id", image.id);

                if (dbError) {
                    throw dbError;
                }

                if (image.file_path) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove([image.file_path]);

                    if (storageError) {
                        console.error("Storage削除エラー:", storageError);
                    }
                }
            }
        }

        // =========================================
        // 編集保存
        // =========================================
        document.getElementById("editSaveButton").addEventListener("click", async function() {
            if (!canEdit()) {
                notify("このマップはロックされているため、編集できません。");
                return;
            }

            if (editingSpotId === null) {
                notify("編集するスポットが選択されていません。");
                return;
            }

            const name = document.getElementById("editSpotName").value.trim();
            const category = document.getElementById("editSpotCategory").value;
            const subcategory = document.getElementById("editSpotSubcategory").value.trim();
            const address = document.getElementById("editSpotAddress").value.trim();
            const activity = document.getElementById("editSpotActivity").value.trim();
            const note = document.getElementById("editSpotNote").value.trim();

            if (!name) {
                notify("スポット名を入力してください。");
                return;
            }

            const { data: updatedRows, error } =
                await supabaseClient
                    .from("spots")
                    .update({
                        name: name,
                        category: category,
                        subcategory: subcategory,
                        address: address,
                        activity_history: activity,
                        note: note
                    })
                    .eq("id", editingSpotId)
                    .select("id");

            // ロックで拒否された更新は、エラーではなく「0件更新」として返ってくる
            if (!error && (!updatedRows || updatedRows.length === 0)) {
                closeEditForm();
                await explainSaveError(
                    "スポットの更新に失敗しました。",
                    { code: "42501", message: "row-level security" }
                );
                return;
            }

            if (error) {
                await explainSaveError("スポットの更新に失敗しました。", error);
                return;
            }

            try {
                if (imagesToDelete.length > 0) {
                    await deleteMarkedImages();
                }

                if (selectedEditImages.length > 0) {
                    await uploadSpotImages(editingSpotId, selectedEditImages);
                }
            } catch (imageError) {
                console.error("写真更新エラー:", imageError);
                notify(
                    "スポットの文章は更新されましたが、写真の一部処理に失敗しました。\n" +
                    imageError.message
                );
            }

            notify("スポットを更新しました！");
            closeEditForm();
            await loadPlaces();
        });

        // =========================================
        // スポット削除（管理者のみ）
        // =========================================
        async function deleteSpot(id) {
            if (!currentUserIsAdmin) {
                notify("スポットを削除できるのは管理者だけです。");
                return;
            }

            const { data: spot, error: spotError } =
                await supabaseClient
                    .from("spots")
                    .select("name")
                    .eq("id", id)
                    .single();

            if (spotError) {
                notify("スポット情報を取得できませんでした。\n" + spotError.message);
                return;
            }

            const answer = confirm(
                "「" + (spot.name || "このスポット") + "」を削除しますか？\n\n" +
                "この操作は元に戻せません。"
            );

            if (!answer) {
                return;
            }

            // 写真ファイルを先に削除
            const images = await getSpotImages(id);

            if (images.length > 0) {
                const filePaths = images
                    .map(function(image) { return image.file_path; })
                    .filter(function(path) { return !!path; });

                if (filePaths.length > 0) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove(filePaths);

                    if (storageError) {
                        console.error("写真ファイル削除エラー:", storageError);
                    }
                }

                const { error: imageRowsError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .eq("spot_id", id);

                if (imageRowsError) {
                    console.error("写真情報削除エラー:", imageRowsError);
                }
            }

            const { error } =
                await supabaseClient
                    .from("spots")
                    .delete()
                    .eq("id", id);

            if (error) {
                console.error("スポット削除エラー:", error);
                notify("スポットの削除に失敗しました。\n" + error.message);
                return;
            }

            notify("スポットを削除しました！");
            await loadPlaces();
        }

        window.deleteSpot = deleteSpot;
