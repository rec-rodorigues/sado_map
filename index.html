        // =========================================
        // ログイン確認（管理者かどうか）
        // =========================================
        async function checkLogin() {
            const {
                data: { session }
            } = await supabaseClient.auth.getSession();

            currentUserIsAdmin = false;

            if (!session) {
                loginButton.style.display = "inline-block";
                logoutButton.style.display = "none";
                userInfo.textContent = "";
                roleInfo.textContent = "";
                return;
            }

            loginButton.style.display = "none";
            logoutButton.style.display = "inline-block";
            userInfo.textContent = "ログイン中：" + (session.user.email || "");

            const { data: isAdmin, error: adminError } =
                await supabaseClient.rpc("is_map_admin");

            if (adminError) {
                console.error("管理者確認エラー:", adminError);
                roleInfo.textContent = "";
                return;
            }

            currentUserIsAdmin = !!isAdmin;
            roleInfo.textContent = currentUserIsAdmin ? "（管理者）" : "";
        }

        // =========================================
        // マップ一覧
        // =========================================
        function getMapIdFromUrl() {
            const value = new URLSearchParams(location.search).get("map");
            const id = Number(value);
            return value && Number.isInteger(id) ? id : null;
        }

        function setMapIdToUrl(id) {
            const url = new URL(location.href);
            url.searchParams.set("map", String(id));
            history.replaceState(null, "", url);
        }

        async function loadMaps() {
            const { data, error } =
                await supabaseClient
                    .from("maps")
                    .select("id, name, description, is_locked, created_at")
                    .order("created_at", { ascending: true });

            if (error) {
                console.error("マップ一覧取得エラー:", error);
                notify("マップ一覧を取得できませんでした。\n" + error.message);
                maps = [];
            } else {
                maps = data || [];
            }

            // 表示するマップを決める：今のマップ → URLの指定 → 最初のマップ
            const exists = function(id) {
                return maps.some(function(m) { return m.id === id; });
            };

            if (!exists(currentMapId)) {
                const fromUrl = getMapIdFromUrl();
                currentMapId = exists(fromUrl)
                    ? fromUrl
                    : (maps[0] ? maps[0].id : null);
            }

            mapSelect.innerHTML = "";

            maps.forEach(function(m) {
                const option = document.createElement("option");
                option.value = String(m.id);
                option.textContent = m.name + (m.is_locked ? "（閲覧のみ）" : "");
                mapSelect.appendChild(option);
            });

            if (currentMapId !== null) {
                mapSelect.value = String(currentMapId);
                setMapIdToUrl(currentMapId);
            }

            updateMapUi();
        }

        // ロック状態に合わせて画面を切り替える
        function updateMapUi() {
            const currentMap = getCurrentMap();

            if (!currentMap) {
                lockBadge.className = "lock-badge locked";
                lockBadge.textContent = "マップがありません";
                mapDescription.textContent = "";
                controls.style.display = "none";
            } else {
                lockBadge.className =
                    "lock-badge " + (currentMap.is_locked ? "locked" : "unlocked");
                lockBadge.innerHTML =
                    currentMap.is_locked
                        ? "<i class=\"ti ti-lock\"></i>閲覧のみ"
                        : "<i class=\"ti ti-lock-open\"></i>誰でも編集できます";
                mapDescription.textContent = currentMap.description || "";
                controls.style.display = canEdit() ? "block" : "none";
            }

            if (!canEdit() && editMode) {
                setEditMode(false);
                closeSpotForm();
                closeEditForm();
            }

            adminPanel.style.display = currentUserIsAdmin ? "block" : "none";

            if (currentUserIsAdmin) {
                const hasMap = !!currentMap;

                toggleLockButton.disabled = !hasMap;
                document.getElementById("saveMapButton").disabled = !hasMap;
                document.getElementById("deleteMapButton").disabled = !hasMap;

                if (hasMap) {
                    toggleLockButton.innerHTML =
                        currentMap.is_locked
                            ? "<i class=\"ti ti-lock-open\"></i>ロックを解除（誰でも編集可）"
                            : "<i class=\"ti ti-lock\"></i>編集をロック（閲覧のみ）";
                    lockStatusText.textContent =
                        currentMap.is_locked
                            ? "現在：ロック中（管理者以外は閲覧のみ）"
                            : "現在：誰でも編集できます";
                    editMapName.value = currentMap.name || "";
                    editMapDescription.value = currentMap.description || "";
                } else {
                    lockStatusText.textContent = "";
                    editMapName.value = "";
                    editMapDescription.value = "";
                }
            }
        }

        mapSelect.addEventListener("change", async function() {
            currentMapId = Number(mapSelect.value);
            setMapIdToUrl(currentMapId);
            setEditMode(false);
            closeSpotForm();
            closeEditForm();
            updateMapUi();
            await loadPlaces();
        });

        // =========================================
        // 管理者：ロックの切り替え
        // =========================================
        toggleLockButton.addEventListener("click", async function() {
            const currentMap = getCurrentMap();

            if (!currentUserIsAdmin || !currentMap) {
                return;
            }

            const { error } =
                await supabaseClient
                    .from("maps")
                    .update({ is_locked: !currentMap.is_locked })
                    .eq("id", currentMap.id);

            if (error) {
                console.error("ロック切り替えエラー:", error);
                notify("ロックの切り替えに失敗しました。\n" + error.message);
                return;
            }

            await loadMaps();
            await loadPlaces();
        });

        // =========================================
        // 管理者：マップ名・説明の変更
        // =========================================
        document.getElementById("saveMapButton").addEventListener("click", async function() {
            const currentMap = getCurrentMap();

            if (!currentUserIsAdmin || !currentMap) {
                return;
            }

            const name = editMapName.value.trim();

            if (!name) {
                notify("マップ名を入力してください。");
                return;
            }

            const { error } =
                await supabaseClient
                    .from("maps")
                    .update({
                        name: name,
                        description: editMapDescription.value.trim()
                    })
                    .eq("id", currentMap.id);

            if (error) {
                console.error("マップ更新エラー:", error);
                notify("マップの更新に失敗しました。\n" + error.message);
                return;
            }

            await loadMaps();
        });

        // =========================================
        // 管理者：マップ作成
        // =========================================
        async function createMap() {
            if (!currentUserIsAdmin) {
                return;
            }

            const name = newMapName.value.trim();

            if (!name) {
                notify("マップ名を入力してください。");
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("maps")
                    .insert({
                        name: name,
                        description: newMapDescription.value.trim(),
                        is_locked: !newMapUnlocked.checked
                    })
                    .select()
                    .single();

            if (error) {
                console.error("マップ作成エラー:", error);
                notify("マップの作成に失敗しました。\n" + error.message);
                return;
            }

            newMapName.value = "";
            newMapDescription.value = "";
            newMapUnlocked.checked = false;

            currentMapId = data.id;
            setEditMode(false);
            await loadMaps();
            await loadPlaces();

            notify("「" + data.name + "」を作成しました！");
        }

        document.getElementById("createMapButton").addEventListener("click", createMap);

        newMapName.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                createMap();
            }
        });

        // =========================================
        // 管理者：マップ削除（中のスポットと写真も削除）
        // =========================================
        document.getElementById("deleteMapButton").addEventListener("click", async function() {
            const currentMap = getCurrentMap();

            if (!currentUserIsAdmin || !currentMap) {
                return;
            }

            const answer = confirm(
                "マップ「" + currentMap.name + "」を削除しますか？\n\n" +
                "このマップのスポットと写真もすべて削除されます。\n" +
                "この操作は元に戻せません。"
            );

            if (!answer) {
                return;
            }

            const { data: spots, error: spotsError } =
                await supabaseClient
                    .from("spots")
                    .select("id")
                    .eq("map_id", currentMap.id);

            if (spotsError) {
                notify("スポット情報を取得できませんでした。\n" + spotsError.message);
                return;
            }

            const spotIds = (spots || []).map(function(s) { return s.id; });

            if (spotIds.length > 0) {
                const { data: images } =
                    await supabaseClient
                        .from("spot_images")
                        .select("file_path")
                        .in("spot_id", spotIds);

                const filePaths = (images || [])
                    .map(function(image) { return image.file_path; })
                    .filter(function(path) { return !!path; });

                if (filePaths.length > 0) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove(filePaths);

                    if (storageError) {
                        console.error("写真ファイル削除エラー:", storageError);
                    }
                }

                const { error: imageRowsError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .in("spot_id", spotIds);

                if (imageRowsError) {
                    console.error("写真情報削除エラー:", imageRowsError);
                }

                const { error: spotDeleteError } =
                    await supabaseClient
                        .from("spots")
                        .delete()
                        .eq("map_id", currentMap.id);

                if (spotDeleteError) {
                    notify("スポットの削除に失敗しました。\n" + spotDeleteError.message);
                    return;
                }
            }

            const { error } =
                await supabaseClient
                    .from("maps")
                    .delete()
                    .eq("id", currentMap.id);

            if (error) {
                console.error("マップ削除エラー:", error);
                notify("マップの削除に失敗しました。\n" + error.message);
                return;
            }

            notify("マップ「" + currentMap.name + "」を削除しました。");

            currentMapId = null;
            setEditMode(false);
            await loadMaps();
            await loadPlaces();
        });

        // =========================================
        // 認証状態が変わったら再確認
        // =========================================
        supabaseClient.auth.onAuthStateChange(function() {
            setTimeout(async function() {
                await checkLogin();
                await loadMaps();
                await loadPlaces();
            }, 0);
        });

        // =========================================
        // 最初の読み込み
        // =========================================
        (async function initialize() {
            await checkLogin();
            await loadMaps();
            await loadPlaces();
        })();
    </script>
</body>
</html>
