<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>佐渡島マップ</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        h1 {
            margin-top: 0;
        }

        #map {
            height: 600px;
            width: 100%;
            position: relative;
        }

        /* 地図を全画面表示したときのサイズ */
        #map:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        #map:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }

        /* 全画面ボタン */
        .fullscreen-control {
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .fullscreen-control button {
            display: block;
            width: 36px;
            height: 36px;
            border: 0;
            background: white;
            cursor: pointer;
            font-size: 20px;
            line-height: 36px;
            padding: 0;
        }

        .fullscreen-control button:hover {
            background: #f4f4f4;
        }

        .emoji-marker {
            font-size: 30px;
            text-align: center;
            line-height: 40px;
            background: none;
            border: none;
        }

        #authArea,
        #adminPanel,
        #mapBar {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
        }

        #authArea {
            background: #f5f5f5;
            font-size: 14px;
        }

        #adminPanel {
            display: none;
            background: #fff7e6;
            border: 1px solid #f0c36d;
        }

        #adminPanel h3,
        #adminPanel h4 {
            margin: 0 0 8px;
        }

        #authArea button,
        #adminPanel button,
        #controls button,
        #categoryFilters button,
        #formButtons button,
        #editFormButtons button {
            padding: 8px 12px;
            margin-right: 6px;
            cursor: pointer;
        }

        #userInfo,
        #roleInfo {
            margin-left: 6px;
            font-size: 14px;
        }

        /* マップ切り替え */
        #mapBar {
            background: #eef5ff;
            border: 1px solid #b9d3f5;
        }

        .map-bar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        #mapSelect {
            padding: 8px;
            font-size: 15px;
            min-width: 200px;
            max-width: 100%;
        }

        #mapDescription {
            margin-top: 6px;
            font-size: 14px;
            color: #444;
            white-space: pre-wrap;
        }

        .lock-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .lock-badge.unlocked {
            background: #e3f6e5;
            color: #1d6b2a;
            border: 1px solid #9fd5a8;
        }

        .lock-badge.locked {
            background: #f1f1f1;
            color: #555;
            border: 1px solid #ccc;
        }

        /* 管理者パネル */
        .admin-section {
            padding: 10px 0;
            border-top: 1px solid #f0d9a8;
        }

        .admin-section:first-of-type {
            border-top: 0;
        }

        .admin-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .admin-form input[type="text"] {
            padding: 8px;
            width: 260px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .admin-form label {
            font-size: 14px;
        }

        #controls {
            display: none;
            margin: 10px 0;
        }

        #modeText {
            font-weight: bold;
        }

        #editHint {
            display: none;
            font-size: 13px;
            color: #666;
            margin-left: 6px;
        }

        #categoryFilters {
            margin: 10px 0;
        }

        #spotForm,
        #editSpotForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            max-width: 92vw;
            max-height: 88vh;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            box-sizing: border-box;
        }

        #spotForm label,
        #editSpotForm label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        #spotForm input,
        #spotForm select,
        #spotForm textarea,
        #editSpotForm input,
        #editSpotForm select,
        #editSpotForm textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
        }

        #spotForm textarea,
        #editSpotForm textarea {
            min-height: 80px;
            resize: vertical;
        }

        .photo-help {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        #formButtons,
        #editFormButtons {
            margin-top: 15px;
            text-align: right;
        }

        .spot-gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin: 8px 0 12px;
        }

        .spot-gallery-item {
            min-width: 0;
        }

        .spot-gallery img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            background: #eee;
        }

        .photo-preview {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-top: 8px;
        }

        .photo-preview-item {
            position: relative;
        }

        .photo-preview-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .photo-preview-item button {
            position: absolute;
            top: 4px;
            right: 4px;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            background: rgba(0,0,0,0.65);
            color: white;
            line-height: 20px;
            padding: 0;
        }

        .existing-photo-item {
            position: relative;
        }

        .existing-photo-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .existing-photo-item button {
            position: absolute;
            top: 4px;
            right: 4px;
        }

        .small-note {
            font-size: 12px;
            color: #666;
        }

        /* =========================================
           写真ライトボックス
           ========================================= */
        #photoLightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.88);
            align-items: center;
            justify-content: center;
            padding: 60px 20px 40px;
            box-sizing: border-box;
        }

        #photoLightbox.open {
            display: flex;
        }

        #photoLightboxImage {
            display: block;
            max-width: 92vw;
            max-height: 82vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 35px rgba(0,0,0,0.5);
        }

        #photoLightboxClose {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            color: #222;
            font-size: 30px;
            line-height: 44px;
            padding: 0;
            cursor: pointer;
            z-index: 2;
        }

        #photoLightboxCaption {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 12px;
            text-align: center;
            color: white;
            font-size: 15px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        @media (max-width: 600px) {
            #photoLightbox {
                padding: 55px 10px 35px;
            }

            #photoLightboxImage {
                max-width: 96vw;
                max-height: 84vh;
            }

            #photoLightboxClose {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>佐渡島マップ</h1>

    <!-- マップ切り替え（全員に表示） -->
    <div id="mapBar">
        <div class="map-bar-row">
            <label for="mapSelect"><strong>🗺️ マップ：</strong></label>
            <select id="mapSelect"></select>
            <span id="lockBadge" class="lock-badge locked">🔒 閲覧のみ</span>
        </div>
        <div id="mapDescription"></div>
    </div>

    <!-- 編集モード（ロック解除中のマップでは全員に表示） -->
    <div id="controls">
        <button id="editModeButton" type="button">✏️ 編集モード</button>
        <span id="modeText">現在：閲覧モード</span>
        <span id="editHint">地図をクリックするとスポットを追加できます</span>
    </div>

    <!-- 管理者だけ表示 -->
    <div id="adminPanel">
        <h3>👑 管理者メニュー</h3>

        <div class="admin-section">
            <h4>このマップの設定</h4>
            <div class="admin-form">
                <button id="toggleLockButton" type="button">🔒 編集をロック</button>
                <span id="lockStatusText" class="small-note"></span>
            </div>
            <div class="admin-form" style="margin-top:8px;">
                <input type="text" id="editMapName" placeholder="マップ名">
                <input type="text" id="editMapDescription" placeholder="説明（任意）">
                <button id="saveMapButton" type="button">💾 名前・説明を保存</button>
                <button id="deleteMapButton" type="button">🗑️ このマップを削除</button>
            </div>
        </div>

        <div class="admin-section">
            <h4>新しいマップを作る</h4>
            <div class="admin-form">
                <input type="text" id="newMapName" placeholder="例：夏合宿の計画用">
                <input type="text" id="newMapDescription" placeholder="説明（任意）">
                <label>
                    <input type="checkbox" id="newMapUnlocked">
                    作成後すぐに誰でも編集できるようにする
                </label>
                <button id="createMapButton" type="button">➕ 作成</button>
            </div>
        </div>
    </div>

    <!-- カテゴリー絞り込み -->
    <div id="categoryFilters">
        <strong>表示：</strong>
        <button type="button" onclick="showAllLayers()">すべて</button>
        <button type="button" onclick="showCategory('活動場所')">🌾 活動場所</button>
        <button type="button" onclick="showCategory('宿泊地')">🏠 宿泊地</button>
        <button type="button" onclick="showCategory('観光地')">📍 観光地</button>
        <button type="button" onclick="showCategory('飲食店')">🍴 飲食店</button>
        <button type="button" onclick="showCategory('生活用品店')">🛒 生活用品店</button>
    </div>

    <div id="map"></div>

    <!-- 管理者ログイン（閲覧・編集だけならログイン不要） -->
    <div id="authArea">
        <button id="loginButton" type="button">🔑 管理者ログイン（Google）</button>
        <button id="logoutButton" type="button" style="display:none;">ログアウト</button>
        <span id="userInfo"></span>
        <span id="roleInfo"></span>
    </div>


    <!-- 写真ライトボックス -->
    <div id="photoLightbox" aria-hidden="true">
        <button id="photoLightboxClose" type="button" aria-label="写真を閉じる">×</button>
        <img id="photoLightboxImage" src="" alt="拡大写真">
        <div id="photoLightboxCaption"></div>
    </div>

    <!-- スポット追加フォーム -->
    <div id="spotForm">
        <h2>📍 スポットを追加</h2>

        <label for="spotName">スポット名</label>
        <input type="text" id="spotName" placeholder="例：REC活動場所①">

        <label for="spotCategory">カテゴリー</label>
        <select id="spotCategory">
            <option value="活動場所">活動場所</option>
            <option value="宿泊地">宿泊地</option>
            <option value="観光地">観光地</option>
            <option value="飲食店">飲食店</option>
            <option value="生活用品店">生活用品店</option>
        </select>

        <label for="spotSubcategory">詳細カテゴリー</label>
        <input type="text" id="spotSubcategory" placeholder="例：自然風景、博物館など">

        <label for="spotAddress">住所</label>
        <input type="text" id="spotAddress" placeholder="例：佐渡市〇〇地区">

        <label for="spotActivity">活動内容・利用内容</label>
        <textarea id="spotActivity" placeholder="例：棚田の整備、農作業"></textarea>

        <label for="spotNote">メモ</label>
        <textarea id="spotNote" placeholder="自由にメモを入力"></textarea>

        <label for="spotImages">写真（複数選択可能）</label>
        <input type="file" id="spotImages" accept="image/*" multiple>
        <div class="photo-help">JPG・PNGなど。1枚5MB以下。複数枚選択できます。</div>
        <div id="spotPhotoPreview" class="photo-preview"></div>

        <div id="formButtons">
            <button type="button" id="cancelButton">キャンセル</button>
            <button type="button" id="saveButton">保存</button>
        </div>
    </div>

    <!-- スポット編集フォーム -->
    <div id="editSpotForm">
        <h2>✏️ スポットを編集</h2>

        <label for="editSpotName">スポット名</label>
        <input type="text" id="editSpotName">

        <label for="editSpotCategory">カテゴリー</label>
        <select id="editSpotCategory">
            <option value="活動場所">活動場所</option>
            <option value="宿泊地">宿泊地</option>
            <option value="観光地">観光地</option>
            <option value="飲食店">飲食店</option>
            <option value="生活用品店">生活用品店</option>
        </select>

        <label for="editSpotSubcategory">詳細カテゴリー</label>
        <input type="text" id="editSpotSubcategory">

        <label for="editSpotAddress">住所</label>
        <input type="text" id="editSpotAddress">

        <label for="editSpotActivity">活動内容・利用内容</label>
        <textarea id="editSpotActivity"></textarea>

        <label for="editSpotNote">メモ</label>
        <textarea id="editSpotNote"></textarea>

        <label>現在の写真</label>
        <div id="existingEditPhotoPreview" class="photo-preview"></div>
        <div id="legacyEditPhotoPreview"></div>

        <label for="editSpotImages">写真を追加（複数選択可能）</label>
        <input type="file" id="editSpotImages" accept="image/*" multiple>
        <div class="photo-help">既存の写真はそのまま残り、新しく選んだ写真が追加されます。1枚5MB以下。</div>
        <div id="editPhotoPreview" class="photo-preview"></div>

        <div id="editFormButtons">
            <button type="button" id="editCancelButton">キャンセル</button>
            <button type="button" id="editSaveButton">保存</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // =========================================
        // Supabase
        // =========================================
        const SUPABASE_URL =
            "https://cskyusrujmxhczcgkdke.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_T-lOBrjyPzfkPUI8mLbHVA_FIRyAp5X";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        // =========================================
        // Leaflet地図
        // =========================================
        const map = L.map("map").setView([38.0, 138.4], 10);

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        // =========================================
        // 地図の全画面表示
        // =========================================
        const FullscreenControl = L.Control.extend({
            options: {
                position: "topright"
            },

            onAdd: function() {
                const container = L.DomUtil.create(
                    "div",
                    "fullscreen-control leaflet-bar"
                );

                const button = L.DomUtil.create(
                    "button",
                    "fullscreen-button",
                    container
                );

                button.type = "button";
                button.textContent = "⛶";
                button.title = "地図を全画面表示";
                button.setAttribute(
                    "aria-label",
                    "地図を全画面表示"
                );

                // ボタン操作が地図のクリックやドラッグとして
                // 誤認識されないようにする
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                async function toggleFullscreen() {
                    const mapContainer = map.getContainer();

                    try {
                        const isFullscreen =
                            document.fullscreenElement === mapContainer ||
                            document.webkitFullscreenElement === mapContainer;

                        if (!isFullscreen) {
                            if (mapContainer.requestFullscreen) {
                                await mapContainer.requestFullscreen();
                            } else if (mapContainer.webkitRequestFullscreen) {
                                mapContainer.webkitRequestFullscreen();
                            } else {
                                alert("このブラウザでは全画面表示に対応していません。");
                                return;
                            }
                        } else {
                            if (document.exitFullscreen) {
                                await document.exitFullscreen();
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            }
                        }
                    } catch (error) {
                        console.error("全画面表示エラー:", error);
                        alert("全画面表示を開始できませんでした。");
                    }
                }

                button.addEventListener("click", toggleFullscreen);

                function updateFullscreenButton() {
                    const mapContainer = map.getContainer();
                    const isFullscreen =
                        document.fullscreenElement === mapContainer ||
                        document.webkitFullscreenElement === mapContainer;

                    button.title = isFullscreen
                        ? "全画面表示を終了"
                        : "地図を全画面表示";

                    button.setAttribute(
                        "aria-label",
                        isFullscreen
                            ? "全画面表示を終了"
                            : "地図を全画面表示"
                    );

                    // 全画面切り替え後にLeafletの表示サイズを再計算
                    setTimeout(function() {
                        map.invalidateSize();
                    }, 100);
                }

                document.addEventListener(
                    "fullscreenchange",
                    updateFullscreenButton
                );

                document.addEventListener(
                    "webkitfullscreenchange",
                    updateFullscreenButton
                );

                return container;
            }
        });

        map.addControl(new FullscreenControl());

        // =========================================
        // カテゴリー
        // =========================================
        const layers = {
            "活動場所": L.layerGroup().addTo(map),
            "宿泊地": L.layerGroup().addTo(map),
            "観光地": L.layerGroup().addTo(map),
            "飲食店": L.layerGroup().addTo(map),
            "生活用品店": L.layerGroup().addTo(map)
        };

        const icons = {
            "活動場所": L.divIcon({
                html: "🌾",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "宿泊地": L.divIcon({
                html: "🏠",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "観光地": L.divIcon({
                html: "📍",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "飲食店": L.divIcon({
                html: "🍴",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            }),
            "生活用品店": L.divIcon({
                html: "🛒",
                className: "emoji-marker",
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            })
        };

        const defaultIcon = L.divIcon({
            html: "📍",
            className: "emoji-marker",
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        // =========================================
        // 状態
        // =========================================
        let editMode = false;
        let editingSpotId = null;
        let currentUserIsAdmin = false;
        let maps = [];
        let currentMapId = null;
        let newSpotLat = null;
        let newSpotLng = null;
        let temporaryMarker = null;

        let selectedSpotImages = [];
        let selectedEditImages = [];
        let existingEditImages = [];
        let imagesToDelete = [];

        // =========================================
        // HTML要素
        // =========================================
        const loginButton = document.getElementById("loginButton");
        const logoutButton = document.getElementById("logoutButton");
        const userInfo = document.getElementById("userInfo");
        const roleInfo = document.getElementById("roleInfo");
        const controls = document.getElementById("controls");
        const editModeButton = document.getElementById("editModeButton");
        const modeText = document.getElementById("modeText");
        const editHint = document.getElementById("editHint");
        const adminPanel = document.getElementById("adminPanel");
        const mapSelect = document.getElementById("mapSelect");
        const lockBadge = document.getElementById("lockBadge");
        const mapDescription = document.getElementById("mapDescription");
        const toggleLockButton = document.getElementById("toggleLockButton");
        const lockStatusText = document.getElementById("lockStatusText");
        const editMapName = document.getElementById("editMapName");
        const editMapDescription = document.getElementById("editMapDescription");
        const newMapName = document.getElementById("newMapName");
        const newMapDescription = document.getElementById("newMapDescription");
        const newMapUnlocked = document.getElementById("newMapUnlocked");

        // =========================================
        // 今のマップと編集できるかどうか
        // =========================================
        function getCurrentMap() {
            return maps.find(function(m) {
                return m.id === currentMapId;
            }) || null;
        }

        // ロック解除中のマップなら誰でも、ロック中でも管理者は編集できる
        function canEdit() {
            const currentMap = getCurrentMap();

            if (!currentMap) {
                return false;
            }

            return !currentMap.is_locked || currentUserIsAdmin;
        }

        // 保存エラーがロックによるものかを判定して、分かりやすく伝える
        async function explainSaveError(prefix, error) {
            console.error(prefix, error);

            const isPermissionError =
                error && (
                    error.code === "42501" ||
                    /row-level security|permission|policy/i.test(error.message || "")
                );

            if (isPermissionError) {
                alert(
                    prefix + "\n\n" +
                    "このマップは管理者によってロックされたため、編集できません。"
                );
                await loadMaps();
                await loadPlaces();
                return;
            }

            alert(prefix + "\n" + (error && error.message ? error.message : ""));
        }

        // =========================================
        // 画面上のHTMLに安全に文字を入れるための関数
        // =========================================
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/`/g, "&#096;");
        }

        // =========================================
        // 写真プレビュー
        // =========================================
        function renderPhotoPreview(files, previewId, selectedArray) {
            const preview = document.getElementById(previewId);

            if (!preview) {
                console.error("写真プレビュー欄が見つかりません:", previewId);
                return;
            }

            preview.innerHTML = "";

            files.forEach(function(file, index) {
                const reader = new FileReader();

                reader.onload = function(event) {
                    const item = document.createElement("div");
                    item.className = "photo-preview-item";

                    const image = document.createElement("img");
                    image.src = event.target.result;
                    image.alt = "選択した写真";

                    const removeButton = document.createElement("button");
                    removeButton.type = "button";
                    removeButton.textContent = "×";
                    removeButton.title = "この写真を外す";

                    removeButton.addEventListener("click", function() {
                        selectedArray.splice(index, 1);
                        renderPhotoPreview(
                            selectedArray,
                            previewId,
                            selectedArray
                        );
                    });

                    item.appendChild(image);
                    item.appendChild(removeButton);
                    preview.appendChild(item);
                };

                reader.readAsDataURL(file);
            });
        }

        function handlePhotoSelection(inputId, previewId, selectedArray) {
            const input = document.getElementById(inputId);

            // 今回のエラー対策：HTML要素がない場合は処理を止める
            if (!input) {
                console.error("写真入力欄が見つかりません:", inputId);
                return;
            }

            input.addEventListener("change", function() {
                Array.from(input.files || []).forEach(function(file) {
                    if (!file.type.startsWith("image/")) {
                        alert(file.name + " は画像ファイルではありません。");
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        alert(file.name + " は5MBを超えています。");
                        return;
                    }

                    selectedArray.push(file);
                });

                input.value = "";

                renderPhotoPreview(
                    selectedArray,
                    previewId,
                    selectedArray
                );
            });
        }

        // 必ずHTML側に存在するIDを使用
        handlePhotoSelection(
            "spotImages",
            "spotPhotoPreview",
            selectedSpotImages
        );

        handlePhotoSelection(
            "editSpotImages",
            "editPhotoPreview",
            selectedEditImages
        );

        // =========================================
        // Storageへ複数写真をアップロード
        // =========================================
        async function uploadSpotImages(spotId, files) {
            const uploadedImages = [];

            for (const file of files) {
                const extension =
                    file.name.includes(".")
                        ? file.name.split(".").pop().toLowerCase()
                        : "jpg";

                const filePath =
                    spotId + "/" + crypto.randomUUID() + "." + extension;

                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("spot-images")
                        .upload(filePath, file, {
                            cacheControl: "3600",
                            upsert: false
                        });

                if (uploadError) {
                    throw uploadError;
                }

                const { data: publicUrlData } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(filePath);

                const imageUrl = publicUrlData.publicUrl;

                const { data: imageRow, error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .insert({
                            spot_id: spotId,
                            image_url: imageUrl,
                            file_path: filePath
                        })
                        .select()
                        .single();

                if (dbError) {
                    // DB登録に失敗した場合は、今アップロードしたファイルを削除する
                    await supabaseClient.storage
                        .from("spot-images")
                        .remove([filePath]);

                    throw dbError;
                }

                uploadedImages.push(imageRow);
            }

            return uploadedImages;
        }

        // =========================================
        // 写真URLを確実に作る
        // =========================================
        function getPhotoUrl(image) {
            // file_pathがある場合はStorageからURLを作り直す
            // image_urlが古い・誤っている場合でも表示できるようにする
            if (image && image.file_path) {
                const { data } =
                    supabaseClient.storage
                        .from("spot-images")
                        .getPublicUrl(image.file_path);

                if (data && data.publicUrl) {
                    return data.publicUrl;
                }
            }

            return image && image.image_url
                ? image.image_url
                : "";
        }

        // =========================================
        // 写真一覧を取得
        // =========================================
        async function getSpotImages(spotId) {
            const { data, error } =
                await supabaseClient
                    .from("spot_images")
                    .select("id, spot_id, image_url, file_path, created_at")
                    .eq("spot_id", spotId)
                    .order("created_at", { ascending: true });

            if (error) {
                console.error("写真取得エラー:", error);
                return [];
            }

            return (data || []).filter(function(image) {
                return !!getPhotoUrl(image);
            });
        }

        // =========================================
        // ポップアップ写真を作る
        // =========================================
        function buildGalleryHtml(images, spotName) {
            if (!images || images.length === 0) {
                return `
                    <div style="margin:8px 0 12px;">
                        <strong>📷 写真</strong><br>
                        <span style="font-size:13px;color:#777;">写真は登録されていません</span>
                    </div>
                `;
            }

            const galleryItems = images.map(function(image) {
                const photoUrl = getPhotoUrl(image);
                const safeUrl = escapeAttribute(photoUrl);
                const safeName = escapeAttribute(spotName || "スポット写真");

                return `
                    <div class="spot-gallery-item">
                        <img
                            src="${safeUrl}"
                            alt="${safeName}"
                            loading="lazy"
                            data-photo-url="${safeUrl}"
                            data-photo-caption="${safeName}"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                            title="クリックで写真を拡大"
                        >
                        <div style="display:none;font-size:12px;color:#c00;padding:8px;">
                            写真を読み込めませんでした
                        </div>
                    </div>
                `;
            }).join("");

            return `
                <div>
                    <strong>📷 写真（${images.length}枚）</strong>
                    <div class="spot-gallery">${galleryItems}</div>
                    <div style="font-size:12px;color:#777;margin-bottom:10px;">写真をクリックすると大きく表示できます</div>
                </div>
            `;
        }

        // =========================================
        // 写真ライトボックス
        // =========================================
        const photoLightbox = document.getElementById("photoLightbox");
        const photoLightboxImage = document.getElementById("photoLightboxImage");
        const photoLightboxClose = document.getElementById("photoLightboxClose");
        const photoLightboxCaption = document.getElementById("photoLightboxCaption");

        function openPhotoViewer(url, caption) {
            if (!url) {
                return;
            }

            photoLightboxImage.src = url;
            photoLightboxImage.alt = caption || "スポット写真";
            photoLightboxCaption.textContent = caption || "";

            document.body.style.overflow = "hidden";
        }

        function closePhotoViewer() {

        // Leafletのポップアップは動的に生成されるため、
        // document側で写真クリックを受け取る
        document.addEventListener("click", function(event) {

        // =========================================
        // スポット読み込み
        // =========================================
        async function loadPlaces() {
            Object.values(layers).forEach(function(layer) {
                layer.clearLayers();
            });

            if (currentMapId === null) {
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("spots")
                    .select("*")
                    .eq("map_id", currentMapId)
                    .order("id", { ascending: true });

            if (error) {
                console.error("Supabaseエラー:", error);
                alert(
                    "スポット情報を取得できませんでした。\n" +
                    error.message
                );
                return;
            }

            // このマップのスポットの写真だけをまとめて取得
            let allImages = [];
            const spotIds = (data || []).map(function(place) {
                return place.id;
            });

            if (spotIds.length > 0) {
                const { data: imageData, error: imageError } =
                    await supabaseClient
                        .from("spot_images")
                        .select("id, spot_id, image_url, file_path, created_at")
                        .in("spot_id", spotIds)
                        .order("created_at", { ascending: true });

                if (imageError) {
                    console.error("写真一覧取得エラー:", imageError);
                    console.error("Supabaseのspot_images SELECTポリシーを確認してください。");
                } else {
                    allImages = imageData || [];
                }
            }

            const imagesBySpot = {};

            allImages.forEach(function(image) {
                if (!imagesBySpot[image.spot_id]) {
                    imagesBySpot[image.spot_id] = [];
                }
                if (getPhotoUrl(image)) {
                    imagesBySpot[image.spot_id].push(image);
                }
            });

            for (const place of data || []) {
                const marker = L.marker(
                    [place.lat, place.lng],
                    {
                        icon: icons[place.category] || defaultIcon
                    }
                );

                // このスポットに登録されている写真
                const images = imagesBySpot[place.id] || [];

                // 以前の形式で保存された写真も表示
                if (place.image_url && images.length === 0) {
                    images.push({
                        image_url: place.image_url,
                        file_path: null
                    });
                }

                let popupHtml = `
                    <div style="width:280px;">
                        <h2 style="margin:0 0 8px;">${escapeHtml(place.name || "")}</h2>

                        ${buildGalleryHtml(images, place.name)}

                        <p>
                            <strong>カテゴリー：</strong>
                            ${escapeHtml(place.category || "")}
                        </p>

                        ${
                            place.subcategory
                                ? `<p><strong>分類：</strong>${escapeHtml(place.subcategory)}</p>`
                                : ""
                        }

                        <hr>

                        <p>
                            <strong>📍 所在地</strong><br>
                            ${escapeHtml(place.address || "")}
                        </p>

                        <p>
                            <strong>🌾 活動内容・利用内容</strong><br>
                            ${escapeHtml(place.activity_history || "")}
                        </p>

                        <p>
                            <strong>📝 メモ</strong><br>
                            ${escapeHtml(place.note || "")}
                        </p>

                        ${
                            place.description
                                ? `<hr><p>${escapeHtml(place.description)}</p>`
                                : ""
                        }
                `;

                if (canEdit() && editMode) {
                    popupHtml += `
                        <div style="margin-top:12px;">
                            <button
                                type="button"
                                onclick="openEditForm(${Number(place.id)})"
                                style="padding:6px 10px;cursor:pointer;margin-right:5px;"
                            >
                                ✏️ 編集
                            </button>
                    `;

                    if (currentUserIsAdmin) {
                        popupHtml += `
                            <button
                                type="button"
                                onclick="deleteSpot(${Number(place.id)})"
                                style="padding:6px 10px;cursor:pointer;"
                            >
                                🗑️ 削除
                            </button>
                        `;
                    }

                    popupHtml += "</div>";
                }

                popupHtml += "</div>";

                marker.bindPopup(popupHtml);

                if (layers[place.category]) {
                    marker.addTo(layers[place.category]);
                } else {
                    marker.addTo(map);
                }
            }
        }

                deleteButton.textContent = "削除";

                deleteButton.addEventListener("click", function() {
                    const alreadyMarked = imagesToDelete.some(function(item) {
                        return item.id === image.id;

        // =========================================
        // 既存写真削除を実行
        // =========================================
        async function deleteMarkedImages() {
            for (const image of imagesToDelete) {
                const { error: dbError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .eq("id", image.id);

                if (dbError) {
                    throw dbError;
                }

                if (image.file_path) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove([image.file_path]);

                    if (storageError) {
                        console.error("Storage削除エラー:", storageError);

        document.getElementById("editSaveButton").addEventListener("click", async function() {
            if (!canEdit()) {
                alert("このマップはロックされているため、編集できません。");
                return;
            }

            if (editingSpotId === null) {
                alert("編集するスポットが選択されていません。");
                return;
            }

            const name = document.getElementById("editSpotName").value.trim();
            const category = document.getElementById("editSpotCategory").value;
            const subcategory = document.getElementById("editSpotSubcategory").value.trim();
            const address = document.getElementById("editSpotAddress").value.trim();
            const activity = document.getElementById("editSpotActivity").value.trim();
            const note = document.getElementById("editSpotNote").value.trim();

            if (!name) {
                alert("スポット名を入力してください。");
                return;
            }

            const { data: updatedRows, error } =
                await supabaseClient
                    .from("spots")
                    .update({
                        name: name,
                        category: category,
                        subcategory: subcategory,
                        address: address,
                        activity_history: activity,
                        note: note
                    })
                    .eq("id", editingSpotId)
                    .select("id");

            // ロックで拒否された更新は、エラーではなく「0件更新」として返ってくる
            if (!error && (!updatedRows || updatedRows.length === 0)) {
                closeEditForm();
                await explainSaveError(
                    "スポットの更新に失敗しました。",
                    { code: "42501", message: "row-level security" }
                );
                return;
            }

            if (error) {
                await explainSaveError("スポットの更新に失敗しました。", error);
                return;
            }

            try {
                if (imagesToDelete.length > 0) {
                    await deleteMarkedImages();
                }

                if (selectedEditImages.length > 0) {
                    await uploadSpotImages(editingSpotId, selectedEditImages);
                }
            } catch (imageError) {
                console.error("写真更新エラー:", imageError);
                alert(
                    "スポットの文章は更新されましたが、写真の一部処理に失敗しました。\n" +
                    imageError.message
                );

            closeEditForm();
            await loadPlaces();

        // =========================================

        async function deleteSpot(id) {
            if (!currentUserIsAdmin) {
                alert("スポットを削除できるのは管理者だけです。");
                return;
            }

            const { data: spot, error: spotError } =
                await supabaseClient
                    .from("spots")
                    .select("name")
                    .eq("id", id)
                    .single();

            if (spotError) {
                alert("スポット情報を取得できませんでした。\n" + spotError.message);
                return;
            }

            const answer = confirm(
                "「" + (spot.name || "このスポット") + "」を削除しますか？\n\n" +
                "この操作は元に戻せません。"
            );

            if (!answer) {
                return;
            }

            // 写真ファイルを先に削除
            const images = await getSpotImages(id);

            if (images.length > 0) {
                const filePaths = images
                    .map(function(image) { return image.file_path; })
                    .filter(function(path) { return !!path; });

                if (filePaths.length > 0) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove(filePaths);

                    if (storageError) {
                        console.error("写真ファイル削除エラー:", storageError);
                    }
                }

                const { error: imageRowsError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .eq("spot_id", id);

                if (imageRowsError) {
                    console.error("写真情報削除エラー:", imageRowsError);
                }
            }

            const { error } =
                await supabaseClient
                    .from("spots")
                    .delete()
                    .eq("id", id);

            if (error) {
                console.error("スポット削除エラー:", error);
                alert("スポットの削除に失敗しました。\n" + error.message);
                return;
            }

            alert("スポットを削除しました！");
            await loadPlaces();
        }

        window.deleteSpot = deleteSpot;

        // =========================================
        // Googleログイン
        // =========================================
        loginButton.addEventListener("click", async function() {
            const { error } =
                await supabaseClient.auth.signInWithOAuth({
                    provider: "google",
                    options: {
                        redirectTo: "https://ytrnht1222-cmd.github.io/sado_map/"
                    }
                });

            if (error) {
                console.error("ログインエラー:", error);
                alert("ログインに失敗しました。\n" + error.message);
            }
        });

        // =========================================
        // ログアウト
        // =========================================
        logoutButton.addEventListener("click", async function() {
            const { error } = await supabaseClient.auth.signOut();

            if (error) {
                console.error("ログアウトエラー:", error);
                alert("ログアウトに失敗しました。\n" + error.message);
                return;
            }

            location.reload();
        });

        // =========================================
        // ログイン確認（管理者かどうか）
        // =========================================
        async function checkLogin() {
            const {
                data: { session }
            } = await supabaseClient.auth.getSession();

            currentUserIsAdmin = false;

            if (!session) {
                loginButton.style.display = "inline-block";
                logoutButton.style.display = "none";
                userInfo.textContent = "";
                roleInfo.textContent = "";
                return;
            }

            loginButton.style.display = "none";
            logoutButton.style.display = "inline-block";
            userInfo.textContent = "ログイン中：" + (session.user.email || "");

            const { data: isAdmin, error: adminError } =
                await supabaseClient.rpc("is_map_admin");

            if (adminError) {
                console.error("管理者確認エラー:", adminError);
                roleInfo.textContent = "";
                return;
            }

            currentUserIsAdmin = !!isAdmin;
            roleInfo.textContent = currentUserIsAdmin ? "（管理者）" : "";
        }

        // =========================================
        // マップ一覧
        // =========================================
        function getMapIdFromUrl() {
            const value = new URLSearchParams(location.search).get("map");
            const id = Number(value);
            return value && Number.isInteger(id) ? id : null;
        }

        function setMapIdToUrl(id) {
            const url = new URL(location.href);
            url.searchParams.set("map", String(id));
            history.replaceState(null, "", url);
        }

        async function loadMaps() {
            const { data, error } =
                await supabaseClient
                    .from("maps")
                    .select("id, name, description, is_locked, created_at")
                    .order("created_at", { ascending: true });

            if (error) {
                console.error("マップ一覧取得エラー:", error);
                alert("マップ一覧を取得できませんでした。\n" + error.message);
                maps = [];
            } else {
                maps = data || [];
            }

            // 表示するマップを決める：今のマップ → URLの指定 → 最初のマップ
            const exists = function(id) {
                return maps.some(function(m) { return m.id === id; });
            };

            if (!exists(currentMapId)) {
                const fromUrl = getMapIdFromUrl();
                currentMapId = exists(fromUrl)
                    ? fromUrl
                    : (maps[0] ? maps[0].id : null);
            }

            mapSelect.innerHTML = "";

            maps.forEach(function(m) {
                const option = document.createElement("option");
                option.value = String(m.id);
                option.textContent = (m.is_locked ? "🔒 " : "🔓 ") + m.name;
                mapSelect.appendChild(option);
            });

            if (currentMapId !== null) {
                mapSelect.value = String(currentMapId);
                setMapIdToUrl(currentMapId);
            }

            updateMapUi();
        }

        // ロック状態に合わせて画面を切り替える
        function updateMapUi() {
            const currentMap = getCurrentMap();

            if (!currentMap) {
                lockBadge.className = "lock-badge locked";
                lockBadge.textContent = "マップがありません";
                mapDescription.textContent = "";
                controls.style.display = "none";
            } else {
                lockBadge.className =
                    "lock-badge " + (currentMap.is_locked ? "locked" : "unlocked");
                lockBadge.textContent =
                    currentMap.is_locked
                        ? "🔒 閲覧のみ"
                        : "🔓 誰でも編集できます";
                mapDescription.textContent = currentMap.description || "";
                controls.style.display = canEdit() ? "block" : "none";
            }

            if (!canEdit() && editMode) {
                setEditMode(false);
                closeSpotForm();
                closeEditForm();
            }

            adminPanel.style.display = currentUserIsAdmin ? "block" : "none";

            if (currentUserIsAdmin) {
                const hasMap = !!currentMap;

                toggleLockButton.disabled = !hasMap;
                document.getElementById("saveMapButton").disabled = !hasMap;
                document.getElementById("deleteMapButton").disabled = !hasMap;

                if (hasMap) {
                    toggleLockButton.textContent =
                        currentMap.is_locked
                            ? "🔓 ロックを解除（誰でも編集可）"
                            : "🔒 編集をロック（閲覧のみ）";
                    lockStatusText.textContent =
                        currentMap.is_locked
                            ? "現在：ロック中（管理者以外は閲覧のみ）"
                            : "現在：誰でも編集できます";
                    editMapName.value = currentMap.name || "";
                    editMapDescription.value = currentMap.description || "";
                } else {
                    lockStatusText.textContent = "";
                    editMapName.value = "";
                    editMapDescription.value = "";
                }
            }
        }

        mapSelect.addEventListener("change", async function() {
            currentMapId = Number(mapSelect.value);
            setMapIdToUrl(currentMapId);
            setEditMode(false);
            closeSpotForm();
            closeEditForm();
            updateMapUi();
            await loadPlaces();
        });

        // =========================================
        // 管理者：ロックの切り替え
        // =========================================
        toggleLockButton.addEventListener("click", async function() {
            const currentMap = getCurrentMap();

            if (!currentUserIsAdmin || !currentMap) {
                return;
            }

            const { error } =
                await supabaseClient
                    .from("maps")
                    .update({ is_locked: !currentMap.is_locked })
                    .eq("id", currentMap.id);

            if (error) {
                console.error("ロック切り替えエラー:", error);
                alert("ロックの切り替えに失敗しました。\n" + error.message);
                return;
            }

            await loadMaps();
            await loadPlaces();
        });

        // =========================================
        // 管理者：マップ名・説明の変更
        // =========================================
        document.getElementById("saveMapButton").addEventListener("click", async function() {
            const currentMap = getCurrentMap();

            if (!currentUserIsAdmin || !currentMap) {
                return;
            }

            const name = editMapName.value.trim();

            if (!name) {
                alert("マップ名を入力してください。");
                return;
            }

            const { error } =
                await supabaseClient
                    .from("maps")
                    .update({
                        name: name,
                        description: editMapDescription.value.trim()
                    })
                    .eq("id", currentMap.id);

            if (error) {
                console.error("マップ更新エラー:", error);
                alert("マップの更新に失敗しました。\n" + error.message);
                return;
            }

            await loadMaps();
        });

        // =========================================
        // 管理者：マップ作成
        // =========================================
        async function createMap() {
            if (!currentUserIsAdmin) {
                return;
            }

            const name = newMapName.value.trim();

            if (!name) {
                alert("マップ名を入力してください。");
                return;
            }

            const { data, error } =
                await supabaseClient
                    .from("maps")
                    .insert({
                        name: name,
                        description: newMapDescription.value.trim(),
                        is_locked: !newMapUnlocked.checked
                    })
                    .select()
                    .single();

            if (error) {
                console.error("マップ作成エラー:", error);
                alert("マップの作成に失敗しました。\n" + error.message);
                return;
            }

            newMapName.value = "";
            newMapDescription.value = "";
            newMapUnlocked.checked = false;

            currentMapId = data.id;
            setEditMode(false);
            await loadMaps();
            await loadPlaces();

            alert("「" + data.name + "」を作成しました！");
        }

        document.getElementById("createMapButton").addEventListener("click", createMap);

        newMapName.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                createMap();
            }
        });

        // =========================================
        // 管理者：マップ削除（中のスポットと写真も削除）
        // =========================================
        document.getElementById("deleteMapButton").addEventListener("click", async function() {
            const currentMap = getCurrentMap();

            if (!currentUserIsAdmin || !currentMap) {
                return;
            }

            const answer = confirm(
                "マップ「" + currentMap.name + "」を削除しますか？\n\n" +
                "このマップのスポットと写真もすべて削除されます。\n" +
                "この操作は元に戻せません。"
            );

            if (!answer) {
                return;
            }

            const { data: spots, error: spotsError } =
                await supabaseClient
                    .from("spots")
                    .select("id")
                    .eq("map_id", currentMap.id);

            if (spotsError) {
                alert("スポット情報を取得できませんでした。\n" + spotsError.message);
                return;
            }

            const spotIds = (spots || []).map(function(s) { return s.id; });

            if (spotIds.length > 0) {
                const { data: images } =
                    await supabaseClient
                        .from("spot_images")
                        .select("file_path")
                        .in("spot_id", spotIds);

                const filePaths = (images || [])
                    .map(function(image) { return image.file_path; })
                    .filter(function(path) { return !!path; });

                if (filePaths.length > 0) {
                    const { error: storageError } =
                        await supabaseClient.storage
                            .from("spot-images")
                            .remove(filePaths);

                    if (storageError) {
                        console.error("写真ファイル削除エラー:", storageError);
                    }
                }

                const { error: imageRowsError } =
                    await supabaseClient
                        .from("spot_images")
                        .delete()
                        .in("spot_id", spotIds);

                if (imageRowsError) {
                    console.error("写真情報削除エラー:", imageRowsError);
                }

                const { error: spotDeleteError } =
                    await supabaseClient
                        .from("spots")
                        .delete()
                        .eq("map_id", currentMap.id);

                if (spotDeleteError) {
                    alert("スポットの削除に失敗しました。\n" + spotDeleteError.message);
                    return;
                }
            }

            const { error } =
                await supabaseClient
                    .from("maps")
                    .delete()
                    .eq("id", currentMap.id);

            if (error) {
                console.error("マップ削除エラー:", error);
                alert("マップの削除に失敗しました。\n" + error.message);
                return;
            }

            alert("マップ「" + currentMap.name + "」を削除しました。");

            currentMapId = null;
            setEditMode(false);
            await loadMaps();
            await loadPlaces();
        });

        // =========================================
        // 認証状態が変わったら再確認
        // =========================================
        supabaseClient.auth.onAuthStateChange(function() {
            setTimeout(async function() {
                await checkLogin();
                await loadMaps();
                await loadPlaces();
            }, 0);
        });

        // =========================================
        // 最初の読み込み
        // =========================================
        (async function initialize() {
            await checkLogin();
            await loadMaps();
            await loadPlaces();
        })();
    </script>
</body>
</html>
